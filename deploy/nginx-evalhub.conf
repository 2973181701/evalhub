# EvalHub · nginx 站点配置（由 deploy/bootstrap.sh 渲染，__APP_DIR__ / __PORT__ 会被替换）
#
# 要点：
#   1. 前端是 SPA，未知路径必须回落 index.html，否则刷新 #runs 之外的深层链接 404。
#   2. /api 反代到本机 node，并把真实 IP 传过去（审计日志需要）。
#   3. 静态资源长缓存；index.html 绝不缓存，否则发版后用户还在跑旧代码。

upstream evalhub_api {
    server 127.0.0.1:__PORT__;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root __APP_DIR__/frontend/dist;
    index index.html;

    client_max_body_size 16m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # 安全响应头（轻量服务器默认没有任何安全头）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://evalhub_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 评测任务是异步的，但 /api/eval 单条仍可能跑十几秒
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
